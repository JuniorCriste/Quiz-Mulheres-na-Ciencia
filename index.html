<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORA ESTUDAR: MULHERES NA CIÊNCIA!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00bcd4;
            --primary-light: #26c6da;
            --accent: #ff4081;
            --secondary: #6200ea;
            --bg-gradient: linear-gradient(135deg, #0d47a1 0%, #00bcd4 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1a237e;
        }

        body.defeat-theme {
            --primary: #d50000;
            --primary-light: #ff5252;
            --secondary: #3e2723;
            --bg-gradient: linear-gradient(135deg, #263238 0%, #455a64 100%);
            --accent: #ff1744;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        .bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            opacity: 0.18;
            user-select: none;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.2; }
            80% { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(40px) rotate(360deg); opacity: 0; }
        }

        @keyframes floatDown {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.2; }
            80% { opacity: 0.2; }
            100% { transform: translateY(110vh) translateX(-50px) rotate(-360deg); opacity: 0; }
        }

        @keyframes floatDiagonal {
            0% { transform: translateY(110vh) translateX(-20vw) rotate(0deg); opacity: 0; }
            50% { opacity: 0.25; }
            100% { transform: translateY(-10vh) translateX(20vw) rotate(180deg); opacity: 0; }
        }

        .game-container {
            position: relative;
            z-index: 10;
            width: 98%;
            max-width: 1120px;
            min-height: 70vh;
            max-height: 100vh;
            background: var(--card-bg);
            border-radius: 26px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 6px rgba(255, 255, 255, 0.3);
            padding: 20px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
            padding: 20px;
        }

        .start-screen h1 {
            font-family: 'Fredoka', cursive;
            color: var(--secondary);
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0px #b39ddb;
            line-height: 1.3;
        }

        .start-screen p {
            font-size: 1.1rem;
            color: #546e7a;
            max-width: 650px;
            margin-bottom: 30px;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--accent), #f50057);
            color: white;
            border: none;
            padding: 16px 40px;
            font-family: 'Fredoka', cursive;
            font-size: 1.4rem;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0 #880e4f;
            transition: all 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #560027;
        }

        .question-box {
            animation: fadeInQuestion 0.4s ease-in-out;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        @keyframes fadeInQuestion {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-bottom: 2px dashed #b0bec5;
            padding-bottom: 6px;
        }

        .game-header h2 {
            font-family: 'Fredoka', cursive;
            color: var(--secondary);
            font-size: 1.5rem;
            margin: 0;
            text-shadow: 1px 1px 0px #b39ddb;
        }

        .badge-stat {
            background: #e0f7fa;
            color: var(--secondary);
            font-family: 'Fredoka', cursive;
            padding: 5px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            border: 2px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .progress-bar-container {
            background-color: #eceff1;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid #cfd8dc;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-tag {
            font-family: 'Fredoka', cursive;
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .question-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.15rem;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.35;
        }

        .media-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .question-image {
            max-width: 100%;
            max-height: 380px;
            width: auto;
            border-radius: 18px;
            border: 4px solid var(--primary-light);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            object-fit: contain;
            background: #fff;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cfd8dc;
            border-radius: 14px;
            padding: 12px 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: #37474f;
            box-shadow: 0 4px 0 #cfd8dc;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: #e1f5fe;
            border-color: var(--primary);
            color: var(--secondary);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 8px 15px rgba(0, 188, 212, 0.2), 0 6px 0 #b3e5fc;
        }

        .option-btn.correct {
            background: #c8e6c9 !important;
            border-color: #2e7d32 !important;
            color: #1b5e20 !important;
            transform: none !important;
            animation: pulseCorrect 0.4s ease;
        }

        .option-btn.incorrect {
            background: #ffcdd2 !important;
            border-color: #c62828 !important;
            color: #b71c1c !important;
            transform: none !important;
            animation: shakeIncorrect 0.4s ease;
        }

        @keyframes pulseCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shakeIncorrect {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #eceff1;
            padding-top: 10px;
            margin-top: 6px;
            min-height: 52px;
        }

        .feedback-msg {
            font-family: 'Fredoka', cursive;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary), #00838f);
            color: white;
            border: none;
            padding: 10px 28px;
            font-family: 'Fredoka', cursive;
            font-size: 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #006064;
            transition: all 0.2s;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #00363a;
        }

        .score-screen {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .score-screen h2 {
            font-family: 'Fredoka', cursive;
            color: var(--secondary);
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .trophy-icon {
            font-size: 4.5rem;
            margin: 10px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        .score-stats {
            font-size: 1.3rem;
            font-weight: 600;
            color: #37474f;
            margin: 12px 0;
        }

        .score-message {
            font-size: 1.1rem;
            color: #00838f;
            font-family: 'Fredoka', cursive;
            margin-bottom: 18px;
        }

        body.defeat-theme .score-message {
            color: #c62828;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--secondary), #311b92);
            color: white;
            border: none;
            padding: 12px 32px;
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1a237e;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #0d1b60;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            background: #fff;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-content img {
            max-width: 85vw;
            max-height: 75vh;
            border-radius: 12px;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #d32f2f;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <audio id="som-acerto" src="aud/acerto.ogg" preload="auto"></audio>
    <audio id="som-erro" src="aud/erro.ogg" preload="auto"></audio>
    <audio id="som-nota-baixa" src="aud/notabaixa.ogg" preload="auto"></audio>
    <audio id="som-notaboa" src="aud/notaboa.ogg" preload="auto"></audio>
    <audio id="som-trilha" src="aud/trilha.ogg" loop preload="auto"></audio>

    <div class="bg-elements" id="bg-elements"></div>

    <div class="modal-overlay" id="image-modal" onclick="fecharModalZoom()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="fecharModalZoom()">×</button>
            <img id="modal-img" src="" alt="Imagem Ampliada">
        </div>
    </div>

    <div class="game-container">
        
        <div id="start-screen" class="start-screen">
            <h1>BORA ESTUDAR: MULHERES NA CIÊNCIA!</h1>
            <p>Teste seus conhecimentos sobre as grandes cientistas da história, suas descobertas e sua importância para a inovação e a tecnologia nessa aventura interativa!</p>
            <button class="start-btn" onclick="iniciarJogo()">Começar o Jogo 🚀</button>
        </div>

        <div id="quiz-screen" style="display: none; flex-direction: column; flex-grow: 1; justify-content: space-between;">
            <div>
                <div class="game-header">
                    <h2>🔬 Quiz Mulheres na Ciência</h2>
                    <div class="badge-stat" id="score-badge">⭐ 0.0 pts</div>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="question-box" id="question-box-wrapper">
                <div class="question-tag" id="question-tag">Questão 1 de 16</div>
                <div class="question-title" id="question-title">Carregando...</div>
                
                <div id="dynamic-content-area"></div>
            </div>

            <div class="quiz-footer">
                <div class="feedback-msg" id="feedback-msg"></div>
                <button class="next-btn" id="next-btn" onclick="proximaQuestao()">Próxima 🚀</button>
            </div>
        </div>

        <div class="score-screen" id="score-screen">
            <div class="trophy-icon" id="result-icon">🏆</div>
            <h2 id="result-title">Fim da Aventura!</h2>
            <div class="score-stats" id="final-score-text"></div>
            <div class="score-message" id="final-message"></div>
            <button class="restart-btn" onclick="reiniciarJogo()">Jogar Novamente 🔄</button>
        </div>
    </div>

    <script>
        const bgSymbols = ['🔬', '🧬', '⚛️', '🧪', '💻', '⭐', '📚', '🚀', '🔭', '💡'];
        const anims = ['floatUp', 'floatDown', 'floatDiagonal'];
        const bgContainer = document.getElementById('bg-elements');
        
        for (let i = 0; i < 35; i++) {
            const span = document.createElement('div');
            span.className = 'floating-icon';
            span.textContent = bgSymbols[Math.floor(Math.random() * bgSymbols.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.fontSize = (Math.random() * 26 + 12) + 'px';
            
            const selectedAnim = anims[Math.floor(Math.random() * anims.length)];
            const duration = Math.random() * 12 + 8;
            const delay = Math.random() * 8;
            
            span.style.animationName = selectedAnim;
            span.style.animationDuration = duration + 's';
            span.style.animationDelay = delay + 's';
            
            bgContainer.appendChild(span);
        }

        const questoes = [
            {
                num: 1,
                tag: "Pioneirismo • Física e Química",
                texto: "Qual cientista ficou famosa por suas pesquisas sobre radioatividade e foi a primeira mulher a ganhar um Prêmio Nobel?",
                tipo: "texto",
                alternativas: [
                    { texto: "Ada Lovelace", correta: false },
                    { texto: "Marie Curie", correta: true },
                    { texto: "Katherine Johnson", correta: false },
                    { texto: "Rosalind Franklin", correta: false }
                ]
            },
            {
                num: 2,
                tag: "Computação • História",
                texto: "Ada Lovelace é considerada uma pioneira principalmente em qual área?",
                tipo: "texto",
                alternativas: [
                    { texto: "Medicina", correta: false },
                    { texto: "Astronomia", correta: false },
                    { texto: "Programação de computadores", correta: true },
                    { texto: "Química", correta: false }
                ]
            },
            {
                num: 3,
                tag: "Espaço • Matemática",
                texto: "Katherine Johnson realizou cálculos fundamentais para qual instituição?",
                tipo: "texto",
                alternativas: [
                    { texto: "NASA", correta: true },
                    { texto: "UNESCO", correta: false },
                    { texto: "OMS", correta: false },
                    { texto: "FIFA", correta: false }
                ]
            },
            {
                num: 4,
                tag: "Exploração Espacial",
                texto: "Os cálculos de Katherine Johnson contribuíram diretamente para:",
                tipo: "texto",
                alternativas: [
                    { texto: "A criação do primeiro celular", correta: false },
                    { texto: "Missões espaciais tripuladas", correta: true },
                    { texto: "A descoberta da penicilina", correta: false },
                    { texto: "A invenção da televisão", correta: false }
                ]
            },
            {
                num: 5,
                tag: "Genética • Biologia Molecular",
                texto: "Rosalind Franklin teve papel fundamental nos estudos que ajudaram a compreender a estrutura:",
                tipo: "texto",
                alternativas: [
                    { texto: "Do DNA", correta: true },
                    { texto: "Do Sol", correta: false },
                    { texto: "Do átomo de hidrogênio", correta: false },
                    { texto: "Dos oceanos", correta: false }
                ]
            },
            {
                num: 6,
                tag: "Cientistas do Brasil • Genética",
                texto: "Qual dessas cientistas brasileiras ficou conhecida por seus estudos em genética e por sua atuação na divulgação científica?",
                tipo: "texto",
                alternativas: [
                    { texto: "Marta", correta: false },
                    { texto: "Mayana Zatz", correta: true },
                    { texto: "Tarsila do Amaral", correta: false },
                    { texto: "Cora Coralina", correta: false }
                ]
            },
            {
                num: 7,
                tag: "Prêmios Nobel • Marie Curie",
                texto: "Marie Curie ganhou Prêmios Nobel em duas áreas diferentes. Quais?",
                tipo: "texto",
                alternativas: [
                    { texto: "Física e Química", correta: true },
                    { texto: "Matemática e Física", correta: false },
                    { texto: "Medicina e Biologia", correta: false },
                    { texto: "Química e Matemática", correta: false }
                ]
            },
            {
                num: 8,
                tag: "Ciência no Brasil • Zoologia",
                texto: "Bertha Lutz, importante cientista brasileira, atuou especialmente na área de:",
                tipo: "texto",
                alternativas: [
                    { texto: "Zoologia", correta: true },
                    { texto: "Engenharia espacial", correta: false },
                    { texto: "Computação", correta: false },
                    { texto: "Geologia", correta: false }
                ]
            },
            {
                num: 9,
                tag: "História da Tecnologia",
                texto: "Verdadeiro ou falso: Ada Lovelace viveu muito antes dos computadores modernos que usamos atualmente.",
                tipo: "texto",
                alternativas: [
                    { texto: "Verdadeiro", correta: true },
                    { texto: "Falso", correta: false }
                ]
            },
            {
                num: 10,
                tag: "Educação • Conceito STEM",
                texto: "Qual destas áreas faz parte da chamada STEM?",
                tipo: "texto",
                alternativas: [
                    { texto: "Ciência, Tecnologia, Engenharia e Matemática", correta: true },
                    { texto: "Somente Medicina e Biologia", correta: false },
                    { texto: "Somente Tecnologia", correta: false },
                    { texto: "História, Artes e Literatura", correta: false }
                ]
            },
            {
                num: 11,
                tag: "Virologia • Pandemia",
                texto: "Jaqueline Goes de Jesus ganhou destaque durante a pandemia de COVID-19 porque participou:",
                tipo: "texto",
                alternativas: [
                    { texto: "Da construção de respiradores", correta: false },
                    { texto: "Do sequenciamento do genoma do coronavírus no Brasil", correta: true },
                    { texto: "Da criação do primeiro hospital digital", correta: false },
                    { texto: "Da descoberta da penicilina", correta: false }
                ]
            },
            {
                num: 12,
                tag: "Liderança Indígena e Acadêmica",
                texto: "Sônia Guajajara é uma importante liderança indígena brasileira. Sua formação acadêmica inicial é na área de:",
                tipo: "texto",
                alternativas: [
                    { texto: "Matemática", correta: false },
                    { texto: "Letras e Enfermagem", correta: true },
                    { texto: "Engenharia", correta: false },
                    { texto: "Astronomia", correta: false }
                ]
            },
            {
                num: 13,
                tag: "Pesquisa Científica no Brasil",
                texto: "A pesquisadora negra brasileira Jaqueline Goes de Jesus tem formação e atuação científica ligada principalmente à:",
                tipo: "texto",
                alternativas: [
                    { texto: "Biomedicina e genômica", correta: true },
                    { texto: "Engenharia civil", correta: false },
                    { texto: "Astronomia", correta: false },
                    { texto: "Matemática financeira", correta: false }
                ]
            },
            {
                num: 14,
                tag: "Saberes Tradicionais",
                texto: "Mulheres indígenas possuem conhecimentos tradicionais importantes para diferentes áreas da ciência. Qual destes é um exemplo?",
                tipo: "texto",
                alternativas: [
                    { texto: "Conhecimentos sobre plantas, biodiversidade e uso dos recursos naturais", correta: true },
                    { texto: "Apenas conhecimentos sobre computadores", correta: false },
                    { texto: "Somente conhecimentos matemáticos", correta: false },
                    { texto: "Nenhuma das alternativas", correta: false }
                ]
            },
            {
                num: 15,
                tag: "Genética e Inclusão",
                texto: "Qual cientista brasileira ficou conhecida internacionalmente por suas pesquisas sobre doenças genéticas e por defender a inclusão de pessoas com deficiência na ciência?",
                tipo: "texto",
                alternativas: [
                    { texto: "Mayana Zatz", correta: true },
                    { texto: "Bertha Lutz", correta: false },
                    { texto: "Jaqueline Goes de Jesus", correta: false },
                    { texto: "Sônia Guajajara", correta: false }
                ]
            },
            {
                num: 16,
                tag: "Diversidade e Inovação",
                texto: "Por que é importante incentivar a participação das mulheres na ciência e na tecnologia?",
                tipo: "texto",
                alternativas: [
                    { texto: "Para que apenas mulheres possam trabalhar nessas áreas", correta: false },
                    { texto: "Para aumentar a diversidade de ideias e contribuir para novas descobertas", correta: true },
                    { texto: "Porque homens não podem mais trabalhar nessas áreas", correta: false },
                    { texto: "Para substituir outras profissões", correta: false }
                ]
            }
        ];

        let indiceAtual = 0;
        let pontuacaoTotal = 0;
        let respondido = false;

        const startScreenEl = document.getElementById("start-screen");
        const quizScreenEl = document.getElementById("quiz-screen");
        const scoreScreenEl = document.getElementById("score-screen");
        const questionTagEl = document.getElementById("question-tag");
        const questionTitleEl = document.getElementById("question-title");
        const dynamicContentArea = document.getElementById("dynamic-content-area");
        const feedbackMsgEl = document.getElementById("feedback-msg");
        const nextBtnEl = document.getElementById("next-btn");
        const progressFillEl = document.getElementById("progress-fill");
        const scoreBadgeEl = document.getElementById("score-badge");
        const finalScoreTextEl = document.getElementById("final-score-text");
        const finalMessageEl = document.getElementById("final-message");
        const questionBoxWrapper = document.getElementById("question-box-wrapper");
        const resultIconEl = document.getElementById("result-icon");
        const resultTitleEl = document.getElementById("result-title");

        const somAcerto = document.getElementById("som-acerto");
        const somErro = document.getElementById("som-erro");
        const somNotaBaixa = document.getElementById("som-nota-baixa");
        const somNotaBoa = document.getElementById("som-notaboa");
        const somTrilha = document.getElementById("som-trilha");

        function iniciarJogo() {
            document.body.classList.remove("defeat-theme");
            startScreenEl.style.display = "none";
            quizScreenEl.style.display = "flex";
            
            somTrilha.currentTime = 0;
            somTrilha.play().catch(e => console.log("Áudio bloqueado pelo navegador até interação"));

            indiceAtual = 0;
            pontuacaoTotal = 0;
            carregarQuestao();
        }

        function embaralharArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function abrirModalZoom(src) {
            const modal = document.getElementById("image-modal");
            const modalImg = document.getElementById("modal-img");
            modalImg.src = src;
            modal.classList.add("active");
        }

        function fecharModalZoom() {
            const modal = document.getElementById("image-modal");
            modal.classList.remove("active");
        }

        function carregarQuestao() {
            respondido = false;
            feedbackMsgEl.textContent = "";
            nextBtnEl.style.display = "none";
            dynamicContentArea.innerHTML = "";

            questionBoxWrapper.style.animation = 'none';
            questionBoxWrapper.offsetHeight; 
            questionBoxWrapper.style.animation = 'fadeInQuestion 0.4s ease-in-out';

            const q = questoes[indiceAtual];
            questionTagEl.textContent = `Questão ${indiceAtual + 1} de ${questoes.length} • ${q.tag}`;
            questionTitleEl.textContent = q.texto;

            const progressoPercent = (indiceAtual / questoes.length) * 100;
            progressFillEl.style.width = `${progressoPercent}%`;

            const alternativasEmbaralhadas = embaralharArray(q.alternativas);

            if (q.imagem) {
                const mediaDiv = document.createElement("div");
                mediaDiv.className = "media-container";
                let clickAttr = q.zoomavel ? `onclick="abrirModalZoom('${q.imagem}')"` : "";
                let legendHtml = q.zoomavel ? `<div class="image-hint-legend">🔍 Clique na imagem para ver ampliado</div>` : "";
                mediaDiv.innerHTML = `<img id="question-image" class="question-image" src="${q.imagem}" alt="Imagem da Questão" ${clickAttr}>${legendHtml}`;
                dynamicContentArea.appendChild(mediaDiv);
            }

            const gridDiv = document.createElement("div");
            gridDiv.className = "options-grid";
            alternativasEmbaralhadas.forEach((alt, idx) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                const letras = ['A', 'B', 'C', 'D'];
                btn.innerHTML = `<strong>${letras[idx]})&nbsp;</strong> ${alt.texto.replace(/^[A-D]\)\s*/, '')}`;
                btn.onclick = () => selecionarAlternativa(alt, btn, q);
                gridDiv.appendChild(btn);
            });
            dynamicContentArea.appendChild(gridDiv);
        }

        function selecionarAlternativa(alt, btnElement, q) {
            if (respondido) return;
            respondido = true;

            const botoes = dynamicContentArea.querySelectorAll("button");
            botoes.forEach(b => b.disabled = true);

            const valorPorQuestao = 10 / questoes.length;

            if (alt.correta) {
                btnElement.classList.add("correct");
                pontuacaoTotal += valorPorQuestao;
                feedbackMsgEl.textContent = "🎉 Resposta Correta!";
                feedbackMsgEl.style.color = "#2e7d32";
                somAcerto.currentTime = 0;
                somAcerto.play();
            } else {
                btnElement.classList.add("incorrect");
                feedbackMsgEl.textContent = "❌ Resposta Incorreta!";
                feedbackMsgEl.style.color = "#c62828";
                somErro.currentTime = 0;
                somErro.play();

                botoes.forEach(b => {
                    const textoBotao = b.textContent.trim();
                    const corretaTexto = q.alternativas.find(a => a.correta).texto.replace(/^[A-D]\)\s*/, '');
                    if (textoBotao.includes(corretaTexto)) {
                        b.classList.add("correct");
                    }
                });
            }

            scoreBadgeEl.textContent = `⭐ ${pontuacaoTotal.toFixed(1)} pts`;
            progressFillEl.style.width = `${((indiceAtual + 1) / questoes.length) * 100}%`;
            nextBtnEl.style.display = "block";
        }

        function proximaQuestao() {
            indiceAtual++;
            if (indiceAtual < questoes.length) {
                carregarQuestao();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            quizScreenEl.style.display = "none";
            scoreScreenEl.style.display = "block";

            somTrilha.pause();
            somTrilha.currentTime = 0;

            const notaFinal = pontuacaoTotal;
            finalScoreTextEl.textContent = `Sua nota final foi: ${notaFinal.toFixed(1)} de 10.0`;

            if (notaFinal < 6) {
                document.body.classList.add("defeat-theme");
                resultIconEl.textContent = "⚠️";
                resultTitleEl.textContent = "Quase lá!";
                finalMessageEl.textContent = "Continue estudando e praticando! Você consegue melhorar ainda mais!";
                somNotaBaixa.currentTime = 0;
                somNotaBaixa.play();
            } else {
                document.body.classList.remove("defeat-theme");
                resultIconEl.textContent = "🏆";
                resultTitleEl.textContent = "Fim da Aventura!";
                finalMessageEl.textContent = "Parabéns! Excelente desempenho no quiz sobre Mulheres na Ciência!";
                somNotaBoa.currentTime = 0;
                somNotaBoa.play();
            }
        }

        function reiniciarJogo() {
            scoreScreenEl.style.display = "none";
            iniciarJogo();
        }
    </script>
</body>
</html>
